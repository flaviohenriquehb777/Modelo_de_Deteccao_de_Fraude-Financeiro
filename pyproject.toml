# =============================================================================
# Projeto: Modelo de Deteccao de Fraude Financeira (Credicard)
# -----------------------------------------------------------------------------
# Fonte de verdade das dependencias e do ambiente reprodutivel via UV.
# As versoes abaixo espelham o ambiente validado onde o `dvc repro` roda
# (mesmos pins do requirements.txt). O `uv.lock` congela tambem as dependencias
# transitivas com hashes, garantindo reprodutibilidade entre maquinas e na CI.
# =============================================================================
[project]
name = "modelo-deteccao-fraude-financeiro"
version = "1.3.0"
description = "Deteccao de fraude financeira em transacoes de cartao de credito com XGBoost, SHAP, MLflow/DagsHub e pipeline DVC reproduzivel."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE.md" }
authors = [
    { name = "Flavio Henrique Barbosa", email = "flaviohenriquehb777@outlook.com" },
]

dependencies = [
    # --- Manipulacao e processamento de dados ---
    "pandas==2.3.3",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "numexpr==2.14.1",
    "pyarrow==24.0.0",
    "openpyxl==3.1.5",
    # --- Machine Learning ---
    "scikit-learn==1.9.0",
    "xgboost==3.3.0",
    "imbalanced-learn==0.14.2",
    "joblib==1.5.3",
    # --- Visualizacao ---
    "matplotlib==3.11.0",
    "seaborn==0.13.2",
    # --- Explainability ---
    "shap==0.52.0",
    # numba e a engine JIT do SHAP. Pinado explicitamente para garantir um
    # wheel compativel com numpy 2.4 na resolucao universal do uv (sem o pin,
    # o resolvedor recua para um numba antigo, sem wheel e incompativel).
    "numba==0.68.1",
    # --- Relatorios e configuracao ---
    "fpdf2==2.8.7",
    "PyYAML==6.0.3",
    # --- MLOps (versionamento, rastreamento) ---
    "dvc==3.67.1",
    "dagshub==0.7.0",
    "mlflow==3.14.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.0",
    "ruff>=0.9.0",
]

# O projeto nao e um pacote instalavel: roda a partir da raiz do repositorio
# (`python -m src.serving.cli`) e o pytest resolve os imports via conftest.py.
#
# `environments` restringe a resolucao universal do uv as plataformas suportadas
# (Windows no dev e Linux na CI, alem de macOS Apple Silicon). Sem isso, o
# resolvedor tenta cobrir macOS x86_64, onde o SHAP 0.52 exige `llvmlite<0.46` e
# forcaria o downgrade do numba para uma versao antiga e sem wheel.
[tool.uv]
package = false
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
