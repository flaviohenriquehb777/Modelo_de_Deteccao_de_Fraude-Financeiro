name: CI Tests - Fraud Detection
on: [push, pull_request]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Python 3.12: exigido por xgboost 3.3 e shap 0.52 (requires-python >= 3.12).
    # Deve ser o mesmo interpretador usado para gerar o dvc.lock.
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # Todas as versoes (inclusive dvc) vem fixadas do requirements.txt.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest==9.1.0

    - name: Validate dependencies
      run: |
        python -m pip check

    - name: Configure DVC with DagsHub
      run: |
        dvc remote modify --local dagshub url https://dagshub.com/${{ secrets.DAGSHUB_USER || github.repository_owner }}/${{ secrets.DAGSHUB_REPO_NAME || github.event.repository.name }}.dvc
        dvc remote modify --local dagshub auth basic
        dvc remote modify --local dagshub user ${{ secrets.DAGSHUB_USER || github.repository_owner }}
        dvc remote modify --local dagshub password ${{ secrets.DAGSHUB_TOKEN }}
        dvc remote list
        dvc remote default

    - name: Pull data and model from DVC
      run: |
        dvc pull

    - name: Run test suite
      run: |
        pytest -q

    # Gate de reprodutibilidade: o pipeline deve ficar "up to date" apos um repro.
    # Isso prova que o ambiente fixado reproduz exatamente os hashes do dvc.lock.
    - name: Test DVC reproducibility
      run: |
        dvc status
        dvc repro
        STATUS="$(dvc status)"
        echo "$STATUS"
        echo "$STATUS" | grep -q "up to date" || { echo "::error::Pipeline DVC nao e idempotente apos dvc repro"; exit 1; }
        dvc version
