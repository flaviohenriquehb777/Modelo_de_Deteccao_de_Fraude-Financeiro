name: CI Tests - Fraud Detection
on: [push, pull_request]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    # Ambiente reprodutivel via uv: a versao do Python vem do .python-version
    # (3.12, exigida por xgboost 3.3 e shap 0.52) e as dependencias vem do
    # uv.lock, que congela o grafo transitivo com hashes (mesmo do ambiente
    # local). `--frozen` garante que a CI nunca reescreva o lock.
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.12.5"
        enable-cache: true

    - name: Set up Python 3.12
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --frozen

    - name: Validate dependencies
      run: uv pip check

    # Gate de qualidade: "zero warnings" (ruff) em src, tests, conftest e scripts.
    - name: Lint (ruff)
      run: uv run ruff check .

    - name: Configure DVC with DagsHub
      run: |
        uv run dvc remote modify --local dagshub url https://dagshub.com/${{ secrets.DAGSHUB_USER || github.repository_owner }}/${{ secrets.DAGSHUB_REPO_NAME || github.event.repository.name }}.dvc
        uv run dvc remote modify --local dagshub auth basic
        uv run dvc remote modify --local dagshub user ${{ secrets.DAGSHUB_USER || github.repository_owner }}
        uv run dvc remote modify --local dagshub password ${{ secrets.DAGSHUB_TOKEN }}
        uv run dvc remote list
        uv run dvc remote default

    - name: Pull data and model from DVC
      run: uv run dvc pull

    - name: Run test suite
      run: uv run pytest -q

    # Gate de reprodutibilidade: o pipeline deve ficar "up to date" apos um repro.
    # Isso prova que o ambiente fixado reproduz exatamente os hashes do dvc.lock.
    - name: Test DVC reproducibility
      run: |
        uv run dvc status
        uv run dvc repro
        STATUS="$(uv run dvc status)"
        echo "$STATUS"
        echo "$STATUS" | grep -q "up to date" || { echo "::error::Pipeline DVC nao e idempotente apos dvc repro"; exit 1; }
        uv run dvc version
