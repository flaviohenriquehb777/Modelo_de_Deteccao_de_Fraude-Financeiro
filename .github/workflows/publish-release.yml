name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
      - "snapshot"
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar/atualizar como Release (ex: v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

# Serializa execucoes do mesmo ref. Um `git push` de tag dispara os eventos
# `create` e `push` ao mesmo tempo; sem isso, ambos consultam a release antes
# de ela existir e um dos dois POSTs falha com HTTP 422 (race condition).
concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    if: github.event_name != 'create' || github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          OWNER="${REPO_FULL%%/*}"
          REPO="${REPO_FULL##*/}"

          sha="$(git rev-list -n 1 "$TAG")"

          prerelease="false"
          title="$TAG"
          notes=""

          if [ "$TAG" = "snapshot" ]; then
            prerelease="true"
            title="snapshot — Entrega original (referência)"
            notes=$'Snapshot do estado original do modelo (sem reescrever histórico).\n\n- Tag: snapshot\n- Commit: '"$sha"$'\n\nUse este ponto para referência da entrega original.'
          elif [ "$TAG" = "v1.0.0" ]; then
            title="v1.0.0 — Entrega original do modelo"
            notes=$'Entrega original do modelo, preservando o histórico.\n\n- Tag: v1.0.0\n- Commit: '"$sha"$'\n\nInclui estrutura do repositório e pipeline MLOps conforme entrega original.'
          elif [ "$TAG" = "v1.1.0" ]; then
            title="v1.1.0 — Rename + DagsHub/DVC/CI"
            notes=$'Ajustes pós-rename do repositório e correções de integração com DagsHub/DVC/CI.\n\n- Tag: v1.1.0\n- Commit: '"$sha"$'\n\nPrincipais pontos:\n- Links e instruções atualizados no README\n- DVC remoto alinhado ao novo repositório no DagsHub\n- GitHub Actions executa dvc pull + testes usando secrets\n\nObservação: credenciais do DagsHub devem ser configuradas via secrets/--local (não versionar tokens).'
          elif [ "$TAG" = "v1.5.0" ]; then
            title="v1.5.0 — Governança, CI e release"
            notes=$'Governança de qualidade e reforço de reprodutibilidade no CI.\n\n- Tag: v1.5.0\n- Commit: '"$sha"$'\n\nPrincipais pontos:\n- `ruff` sem avisos e como gate obrigatório na CI (src, tests, conftest e scripts)\n- Notebooks históricos higienizados (sem saídas/execução) e fora do lint\n- Gate de idempotência do DVC mantido (`dvc repro` -> `up to date`)\n- README e docs/evaluator-guide revisados\n\nMétricas do modelo (sem vazamento de dados): precisão 0,9611 / recall 0,8028 (PASS).'
          elif [ "$TAG" = "v1.6.0" ]; then
            title="v1.6.0 — Serving empacotado (FastAPI + Docker)"
            notes=$'Camada de serving de REFERENCIA: empacotada e testada, mas sem deploy.\n\n- Tag: v1.6.0\n- Commit: '"$sha"$'\n\nPrincipais pontos:\n- API HTTP FastAPI (`/health`, `/model/metadata`, `/predict`) sobre o mesmo contrato de inferencia da CLI\n- Testes de contrato HTTP (payload invalido -> HTTP 422, contrato fail-closed)\n- Imagem Docker reprodutivel (`uv sync --frozen`) com HEALTHCHECK; build validado na CI, SEM publicar em registry\n- README e docs/evaluator-guide rotulando a camada como referencia (sem SLA, autenticacao ou monitoramento)\n\nMetricas do modelo (sem vazamento de dados): precisao 0,9611 / recall 0,8028 (PASS).'
          else
            title="$TAG"
            notes=$'Release publicada automaticamente.\n\n- Tag: '"$TAG"$'\n- Commit: '"$sha"
          fi

          release_id=""
          if id="$(gh api "/repos/$OWNER/$REPO/releases/tags/$TAG" -q .id 2>/dev/null)"; then
            release_id="$id"
          fi

          if [ -z "$release_id" ]; then
            html_url="$(gh api -X POST "/repos/$OWNER/$REPO/releases" \
              -f tag_name="$TAG" \
              -f name="$title" \
              -f body="$notes" \
              -F prerelease="$prerelease" \
              -F draft=false \
              -q .html_url)"
          else
            html_url="$(gh api -X PATCH "/repos/$OWNER/$REPO/releases/$release_id" \
              -f tag_name="$TAG" \
              -f name="$title" \
              -f body="$notes" \
              -F prerelease="$prerelease" \
              -F draft=false \
              -q .html_url)"
          fi

          echo "Release pronta: $html_url"
